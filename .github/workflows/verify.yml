name: Verificar TacticalTrack
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: API/pom.xml
      - run: mvn -B -f API/pom.xml test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x APP/gradlew
      - run: ./APP/gradlew -p APP testDebugUnitTest logicCoverageReport verifyLogicCoverage assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informes-android
          path: APP/app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: APP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
