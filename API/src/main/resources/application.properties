spring.application.name=tacticaltrack-visits
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/tacticaltrack}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=always
spring.jackson.deserialization.fail-on-unknown-properties=true

# Activar solo cuando exista proyecto Firebase y credencial de servidor.
push.enabled=${PUSH_ENABLED:false}
push.project-id=${FIREBASE_PROJECT_ID:}
push.poll-ms=${PUSH_POLL_MS:15000}
